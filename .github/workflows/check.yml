name: check
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/metrics.cjs
      - run: python -m py_compile mergeprint/*.py demo/*.py tools/*.py
      - run: ./demo.sh
      - run: git diff --exit-code -- docs/index.html demo/raw.json
