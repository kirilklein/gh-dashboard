[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mergeprint"
version = "0.1.0"
description = "See what you actually shipped: a local, private report of your GitHub pull requests"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Kiril Klein"}]
requires-python = ">=3.9"
dependencies = []
keywords = ["github", "pull-requests", "report", "engineering-metrics", "local-first"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/kirilklein/mergeprint"
Demo = "https://kirilklein.github.io/mergeprint/"

[project.scripts]
mergeprint = "mergeprint.cli:main"

[tool.setuptools]
packages = ["mergeprint"]

[tool.setuptools.package-data]
mergeprint = ["template.html", "holidays.json", "config.json"]
